[package]
name = "figy-term"
version = "0.1.0"
description = "A local AI-ready terminal application"
authors = ["you"]
edition = "2021"

[lib]
name = "my_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
# The native folder picker behind "change workspace". A path typed into a text
# box is not an acceptable way to choose a directory.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
sysinfo = "0.35"
# `multipart` is what makes a form upload sendable: it builds the body and the
# boundary, which is not something to hand-roll.
reqwest = { version = "0.12", features = ["json", "multipart"] }
semver = "1"

# The API client's send path. `tokio` is already in the build several times over
# (tauri and reqwest both run on it); naming it here is what makes `select!`
# available, which is how a request in flight is cancelled and how a body being
# downloaded stays interruptible. `base64` is for response bodies that are not
# UTF-8 — an image or a protobuf has to reach the webview intact rather than as
# a field of replacement characters.
tokio = { version = "1", features = ["sync", "macros"] }
base64 = "0.22"

# Where the API client's collections live. `bundled` compiles SQLite itself
# rather than linking whatever the host happens to have, which is the only way
# the same schema and the same pragmas are guaranteed on three platforms.
#
# It is the first thing in this app that persists from Rust, and the reason is
# in `docs/API-CLIENT.md`: the sync engine and the Postgres mirror want the same
# relational shape, so a sync becomes a row copy instead of a translation.
rusqlite = { version = "0.37", features = ["bundled"] }

# The credentials a remote needs. They go to the OS keychain rather than to the
# database or a settings file: a project key in `figyman.db` would be one
# careless backup away from being somebody else's.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Postgres over the wire, for a database this app talks to directly rather than
# through somebody's REST layer. `with-serde_json-1` is what lets a row cross as
# JSON — the same shape the hosted mode already speaks — so one codec serves
# both.
#
# The TLS is the platform's own, through `native-tls`, which `reqwest` already
# pulls in: no second crypto stack, nothing new to compile on three platforms,
# and — the deciding point — its knobs are exactly the five `sslmode` settings.
# "Encrypt but do not check the certificate" and "check the chain but not the
# hostname" are one method call each here, and a hand-written verifier in the
# alternative.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"

# The editor's filesystem layer.
#
# `notify` is the only cross-platform way to hear about a file changing without
# polling — FSEvents, inotify and ReadDirectoryChangesW behind one API. `ignore`
# is ripgrep's directory walker, so a project search skips `.gitignore`d paths
# and `node_modules` for free rather than us reimplementing that badly. `trash`
# is what makes deleting a file from the explorer recoverable.
notify = "8"
ignore = "0.4"
regex = "1"
trash = "5"

# Job objects, so stopping a language server kills the whole tree. Every
# Node-based server is a `.cmd` shim on Windows, which means the process we
# spawn is `cmd.exe` and the server is a `node.exe` below it — see `lsp/job.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    # Gates JOBOBJECT_EXTENDED_LIMIT_INFORMATION, which lives in JobObjects but
    # is feature-gated on Threading.
    "Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance"] }

# For positioning the browser's child webviews, which Tauri can't do on GTK.
# Versions and features match what tauri pulls in, so cargo unifies these onto
# the same crates instead of building a second, incompatible set of bindings.
# Check these still agree on every tauri upgrade.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2", features = ["v2_40"] }
