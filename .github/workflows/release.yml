name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FigyTerm ${{ github.ref_name }}"
          releaseBody: |
            ## FigyTerm ${{ github.ref_name }}

            ### Installation (macOS)

            1. Download `FigyTerm_x.x.x_aarch64.dmg` (Apple Silicon) or `FigyTerm_x.x.x_x64.dmg` (Intel)
            2. Open the `.dmg` file
            3. Drag **FigyTerm** to your **Applications** folder
            4. Launch FigyTerm from Applications

            ### Troubleshooting

            **"FigyTerm can't be opened because it is from an unidentified developer"**
            Go to **System Settings > Privacy & Security** and click **Open Anyway**.

            **"FigyTerm is damaged and can't be opened"**
            Run in Terminal:
            ```
            xattr -cr /Applications/FigyTerm.app
            ```

            **Keychain access popup**
            macOS may ask to access your keychain. Click **Allow** or **Always Allow**. This is normal for apps that interact with system credentials.

            ### What's New
            See [CHANGELOG](https://github.com/code4mk/figyterm/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
