name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.1.0"
        required: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Owns the release metadata. Runs once, before any build, so the body is
  # written exactly once instead of being raced (and then skipped) by the
  # build matrix: tauri-action never edits the title/body of a release that
  # already exists.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          # Anything with a pre-release suffix (v1.0.0-beta.1) ships as a prerelease.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Render release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## FigyTerm v__VERSION__

          ### Updating

          FigyTerm updates itself from here on — it checks for new versions and
          installs them in-app, with no Gatekeeper prompt and no `xattr` step.
          If you're coming from **v0.0.6 or earlier**, this one install is manual;
          after it, updates are automatic.

          ### Installation (macOS)

          Two ways to install. Both give you the same app.

          #### Option 1 — install script (recommended)

          ```
          curl -fsSL https://raw.githubusercontent.com/code4mk/figyterm/main/install.sh | sh
          ```

          One line, no security dialog, no `xattr` step. It picks the right build for
          your Mac and installs to `/Applications`.

          Why it's simpler: FigyTerm isn't code-signed with an Apple Developer ID, and
          macOS quarantines anything downloaded by a **browser**. `curl` isn't a
          browser, so this route avoids the problem rather than working around it.
          [Read the script](https://github.com/code4mk/figyterm/blob/main/install.sh)
          before running it.

          #### Option 2 — download the .dmg manually

          1. Download `FigyTerm___VERSION___aarch64.dmg` (Apple Silicon) or
             `FigyTerm___VERSION___x64.dmg` (Intel)
          2. Open the `.dmg` and drag **FigyTerm** into **Applications**
          3. Clear the quarantine flag macOS added during the download:

             ```
             xattr -cr /Applications/FigyTerm.app
             ```

          4. Launch FigyTerm

          Step 3 isn't optional — without it macOS reports *"FigyTerm is damaged and
          can't be opened"*, which only means the app is unsigned.

          ### Installation (Linux)

          Three formats, with one difference worth knowing.

          **AppImage (recommended)** — runs on any distro, and updates itself:

          ```
          chmod +x FigyTerm___VERSION___amd64.AppImage
          ./FigyTerm___VERSION___amd64.AppImage
          ```

          **Debian / Ubuntu:** `sudo apt install ./FigyTerm___VERSION___amd64.deb`
          **Fedora / RHEL:** `sudo dnf install ./FigyTerm-__VERSION__-1.x86_64.rpm`

          A `.deb` or `.rpm` install belongs to your package manager, so FigyTerm
          won't replace its own files — it tells you a new version exists and leaves
          the install to you. The AppImage is the one that updates in place.

          If the window comes up blank — some Nvidia and older Mesa drivers do this
          to WebKitGTK — start it with:

          ```
          WEBKIT_DISABLE_DMABUF_RENDERER=1 figyterm
          ```

          Full details: [Installation guide](https://github.com/code4mk/figyterm/blob/main/docs/INSTALLATION.md)

          ### Troubleshooting

          **"FigyTerm can't be opened because it is from an unidentified developer"**
          Open **System Settings > Privacy & Security**, scroll down, and click
          **Open Anyway**. On macOS 15 and later this is the only route — Apple removed
          the old right-click > Open shortcut.

          **"FigyTerm is damaged and can't be opened"**
          The quarantine flag is still set. Run:
          ```
          xattr -cr /Applications/FigyTerm.app
          ```

          **Keychain access popup**
          macOS may ask to access your keychain. Click **Allow** or **Always Allow**. This is normal for apps that interact with system credentials.

          ### What's New
          See [CHANGELOG](https://github.com/code4mk/figyterm/blob/main/CHANGELOG.md) for details.
          NOTES
          perl -pi -e 's/__VERSION__/$ENV{VERSION}/g' "$RUNNER_TEMP/notes.md"

      - name: Create or update draft release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          TITLE="FigyTerm $TAG"

          # GET /releases/tags/{tag} only returns *published* releases, so it
          # 404s on the draft we create here. The list endpoint does include
          # drafts, so match on tag_name there instead.
          find_release_id() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | .id' | head -n1
          }

          ID=$(find_release_id)
          if [ -n "$ID" ]; then
            # Re-run: force the body back in sync instead of leaving it stale.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -F name="$TITLE" \
              -F body=@"$RUNNER_TEMP/notes.md" \
              -F draft=true \
              -F prerelease="$PRERELEASE" >/dev/null
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --draft \
              --prerelease="$PRERELEASE" \
              --target "$GITHUB_SHA"
            ID=$(find_release_id)
          fi

          if [ -z "$ID" ]; then
            echo "::error::Could not resolve a release id for tag $TAG"
            exit 1
          fi
          echo "Release id for $TAG: $ID"
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      # The bundle version comes from tauri.conf.json, not from the tag, so
      # without this every release would ship artifacts named after whatever
      # version happens to be committed.
      - name: Sync app version to ${{ needs.create-release.outputs.version }}
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: node scripts/sync-version.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign keypair for the updater. Unrelated to Apple code signing —
          # it only lets installed clients verify an update came from us.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No Apple signing vars here on purpose. A missing secret still sets
          # the variable to an empty string, and the bundler treats a *present*
          # APPLE_CERTIFICATE as "sign this", then fails on `security import`.
          # To enable notarization later, add the block documented in
          # docs/RELEASING.md — don't pre-wire it. See that doc before editing.
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # The manifest is written by the updater-manifest job instead. With a
          # two-target matrix, letting both builds upload latest.json races:
          # whichever finishes last overwrites the other's entry, producing an
          # updater that silently 404s for one architecture.
          uploadUpdaterJson: false

  # Ubuntu 22.04 on purpose, not ubuntu-latest: the binary links against the
  # builder's glibc, so building on 24.04 (glibc 2.39) would refuse to start on
  # Debian 12 and Ubuntu 22.04. 22.04 ships glibc 2.35, which covers every
  # currently supported distro.
  build-linux:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Sync app version to ${{ needs.create-release.outputs.version }}
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: node scripts/sync-version.mjs

      # WebKitGTK is the webview on Linux, and none of this is preinstalled.
      # libfuse2 is for the bundler, not the app: appimagetool ships as an
      # AppImage itself and needs FUSE to run.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl wget file patchelf libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Runners have no FUSE device, so appimagetool has to unpack itself
          # instead of mounting. Without this the AppImage step fails outright.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-unknown-linux-gnu
          # Same reason as the macOS job: the manifest is composed once, later.
          uploadUpdaterJson: false

  # Composes latest.json once, after every build has uploaded its updater
  # artifacts, so it always describes all of them.
  updater-manifest:
    needs: [create-release, build-macos, build-linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Compose and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail

          # The release is still a draft here, so it must be addressed by id.
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            > assets.json

          PLATFORMS='{}'

          # Adds one updater platform entry from the artifact's detached
          # signature. Runs in the current shell, not a subshell, so it can
          # accumulate into $PLATFORMS.
          add_platform() {
            PLATFORM="$1"
            ARTIFACT="$2"

            SIG_ID=$(jq -r --arg n "${ARTIFACT}.sig" \
              '.[] | select(.name == $n) | .id' assets.json | head -n1)

            if [ -z "$SIG_ID" ]; then
              echo "::error::${ARTIFACT}.sig is missing from the release. Is TAURI_SIGNING_PRIVATE_KEY set?"
              exit 1
            fi

            SIG=$(gh api -H "Accept: application/octet-stream" \
              "repos/$GH_REPO/releases/assets/$SIG_ID")

            # Public download URL, valid once the release is undrafted.
            URL="https://github.com/$GH_REPO/releases/download/$TAG/$ARTIFACT"

            PLATFORMS=$(jq \
              --arg k "$PLATFORM" --arg s "$SIG" --arg u "$URL" \
              '. + {($k): {signature: $s, url: $u}}' <<<"$PLATFORMS")
          }

          add_platform darwin-aarch64 "FigyTerm_${VERSION}_aarch64.app.tar.gz"
          add_platform darwin-x86_64 "FigyTerm_${VERSION}_x64.app.tar.gz"

          # Linux updates go through the AppImage, which the updater replaces in
          # place. The .deb and .rpm are downloads only: their files belong to
          # the package manager, so the app must never rewrite them.
          add_platform linux-x86_64 "FigyTerm_${VERSION}_amd64.AppImage"

          jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson p "$PLATFORMS" \
            '{version: $v, notes: "See the release notes on GitHub.", pub_date: $d, platforms: $p}' \
            > latest.json

          cat latest.json

          # Re-runs: drop the previous manifest so the upload doesn't collide.
          OLD_ID=$(jq -r '.[] | select(.name == "latest.json") | .id' assets.json | head -n1)
          if [ -n "$OLD_ID" ]; then
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$OLD_ID" >/dev/null
          fi

          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=latest.json" \
            >/dev/null

          echo "Uploaded latest.json for $TAG"

  publish-release:
    needs: [create-release, build-macos, build-linux, updater-manifest]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Undraft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          PRERELEASE: ${{ needs.create-release.outputs.prerelease }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          # Address the release by id: it is still a draft at this point, and
          # tag-based lookups do not resolve drafts.
          if [ "$PRERELEASE" = "true" ]; then MAKE_LATEST=false; else MAKE_LATEST=true; fi
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$MAKE_LATEST" >/dev/null
          echo "Published $TAG"
