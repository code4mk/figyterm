name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.1.0"
        required: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Owns the release metadata. Runs once, before any build, so the body is
  # written exactly once instead of being raced (and then skipped) by the
  # build matrix: tauri-action never edits the title/body of a release that
  # already exists.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          # Anything with a pre-release suffix (v1.0.0-beta.1) ships as a prerelease.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Render release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## FigyTerm v__VERSION__

          ### Updating

          FigyTerm updates itself from here on — it checks for new versions and
          installs them in-app, with no Gatekeeper prompt and no `xattr` step.
          If you're coming from **v0.0.6 or earlier**, this one install is manual;
          after it, updates are automatic.

          ### Installation (macOS)

          1. Download `FigyTerm___VERSION___aarch64.dmg` (Apple Silicon) or `FigyTerm___VERSION___x64.dmg` (Intel)
          2. Open the `.dmg` file
          3. Drag **FigyTerm** to your **Applications** folder
          4. Launch FigyTerm from Applications

          ### Troubleshooting

          **"FigyTerm can't be opened because it is from an unidentified developer"**
          Go to **System Settings > Privacy & Security** and click **Open Anyway**.

          **"FigyTerm is damaged and can't be opened"**
          Run in Terminal:
          ```
          xattr -cr /Applications/FigyTerm.app
          ```

          **Keychain access popup**
          macOS may ask to access your keychain. Click **Allow** or **Always Allow**. This is normal for apps that interact with system credentials.

          ### What's New
          See [CHANGELOG](https://github.com/code4mk/figyterm/blob/main/CHANGELOG.md) for details.
          NOTES
          perl -pi -e 's/__VERSION__/$ENV{VERSION}/g' "$RUNNER_TEMP/notes.md"

      - name: Create or update draft release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          TITLE="FigyTerm $TAG"

          # GET /releases/tags/{tag} only returns *published* releases, so it
          # 404s on the draft we create here. The list endpoint does include
          # drafts, so match on tag_name there instead.
          find_release_id() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | .id' | head -n1
          }

          ID=$(find_release_id)
          if [ -n "$ID" ]; then
            # Re-run: force the body back in sync instead of leaving it stale.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -F name="$TITLE" \
              -F body=@"$RUNNER_TEMP/notes.md" \
              -F draft=true \
              -F prerelease="$PRERELEASE" >/dev/null
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --draft \
              --prerelease="$PRERELEASE" \
              --target "$GITHUB_SHA"
            ID=$(find_release_id)
          fi

          if [ -z "$ID" ]; then
            echo "::error::Could not resolve a release id for tag $TAG"
            exit 1
          fi
          echo "Release id for $TAG: $ID"
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      # The bundle version comes from tauri.conf.json, not from the tag, so
      # without this every release would ship artifacts named after whatever
      # version happens to be committed.
      - name: Sync app version to ${{ needs.create-release.outputs.version }}
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          '
          # Only the [package] version, which is the first `version =` in the file.
          perl -pi -e 'if (!$done && s/^version = ".*"/version = "$ENV{VERSION}"/) { $done = 1 }' src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign keypair for the updater. Unrelated to Apple code signing —
          # it only lets installed clients verify an update came from us.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing is optional and currently unset; tauri-action builds
          # unsigned when these are absent. Present so enabling notarization
          # later is a secret upload rather than a workflow change.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # The manifest is written by the updater-manifest job instead. With a
          # two-target matrix, letting both builds upload latest.json races:
          # whichever finishes last overwrites the other's entry, producing an
          # updater that silently 404s for one architecture.
          uploadUpdaterJson: false

  # Composes latest.json once, after both architectures have uploaded their
  # updater artifacts, so it always describes both.
  updater-manifest:
    needs: [create-release, build-macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Compose and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail

          # The release is still a draft here, so it must be addressed by id.
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            > assets.json

          PLATFORMS='{}'

          for ARCH in aarch64 x64; do
            case "$ARCH" in
              aarch64) PLATFORM=darwin-aarch64 ;;
              x64)     PLATFORM=darwin-x86_64 ;;
            esac

            TARBALL="FigyTerm_${VERSION}_${ARCH}.app.tar.gz"
            SIG_ID=$(jq -r --arg n "${TARBALL}.sig" \
              '.[] | select(.name == $n) | .id' assets.json | head -n1)

            if [ -z "$SIG_ID" ]; then
              echo "::error::${TARBALL}.sig is missing from the release. Is TAURI_SIGNING_PRIVATE_KEY set?"
              exit 1
            fi

            SIG=$(gh api -H "Accept: application/octet-stream" \
              "repos/$GH_REPO/releases/assets/$SIG_ID")

            # Public download URL, valid once the release is undrafted.
            URL="https://github.com/$GH_REPO/releases/download/$TAG/$TARBALL"

            PLATFORMS=$(jq \
              --arg k "$PLATFORM" --arg s "$SIG" --arg u "$URL" \
              '. + {($k): {signature: $s, url: $u}}' <<<"$PLATFORMS")
          done

          jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson p "$PLATFORMS" \
            '{version: $v, notes: "See the release notes on GitHub.", pub_date: $d, platforms: $p}' \
            > latest.json

          cat latest.json

          # Re-runs: drop the previous manifest so the upload doesn't collide.
          OLD_ID=$(jq -r '.[] | select(.name == "latest.json") | .id' assets.json | head -n1)
          if [ -n "$OLD_ID" ]; then
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$OLD_ID" >/dev/null
          fi

          curl -sSf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=latest.json" \
            >/dev/null

          echo "Uploaded latest.json for $TAG"

  publish-release:
    needs: [create-release, build-macos, updater-manifest]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Undraft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          PRERELEASE: ${{ needs.create-release.outputs.prerelease }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          # Address the release by id: it is still a draft at this point, and
          # tag-based lookups do not resolve drafts.
          if [ "$PRERELEASE" = "true" ]; then MAKE_LATEST=false; else MAKE_LATEST=true; fi
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$MAKE_LATEST" >/dev/null
          echo "Published $TAG"
